# Target repos of this lab. `uv run scripts/lab.py sync-repos` clones or fetches them into .targets/repos/.
# Use HTTPS urls so the lab clones the same way on a laptop and in a cloud session.
# A new target repo is three things: an entry here, its system page (cortex/systems/<name>.md, written from
# cortex/systems/_TEMPLATE.md by whoever adds the entry, before the first experiment), and a line in cortex/index.md.

repos:
  - name: oncolens-explorer                                  # folder name under .targets/repos/
    url: https://github.com/avreymi-asraf/OncoLens-explorer.git
    short_name: onco                                         # used in experiment names: <id>-onco-<worktree-name>
    default_branch: main
